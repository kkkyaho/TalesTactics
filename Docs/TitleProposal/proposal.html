<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TalesTactics · 타이틀 화면 시안</title>
<style>
:root{color-scheme:dark;--gold:#dfc18a;--ivory:#f6f0e2;--muted:#b2becb;--line:#c1aa753c}*{box-sizing:border-box}body{margin:0;background:#070e19;color:var(--ivory);font-family:'Malgun Gothic','Segoe UI',sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:disabled{opacity:.38;cursor:default}button:focus-visible{outline:2px solid #f7d99f;outline-offset:5px}.reviewbar{min-height:52px;padding:12px 3vw;display:flex;gap:16px;align-items:center;justify-content:space-between;background:#0d1622;font-size:12px;color:var(--muted);border-bottom:1px solid #27323f}.reviewbar strong{color:var(--gold);letter-spacing:.14em}.reviewbar button{background:none;border:1px solid #526273;padding:6px 12px}.stage{position:relative;isolation:isolate;min-height:calc(100svh - 52px);background:#0b1828 url('title-background.png') center/cover;display:flex;align-items:center;padding:7vh 8vw 100px}.stage:before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#05101ecc 0%,#06121b66 45%,transparent 76%),linear-gradient(0deg,#060e1bf0,transparent 24%)}.title-content{width:520px;max-width:100%;padding-top:10px}.crest{display:flex;gap:17px;align-items:center;color:var(--gold);font-size:13px;letter-spacing:.3em;margin-bottom:26px}.crest:before{content:'◇';font-size:31px}.crest:after{content:'';width:85px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(50px,6.6vw,96px);letter-spacing:-.04em;line-height:.84;margin:0;text-shadow:0 4px 30px #0008}h1 span{display:block;letter-spacing:.07em;font-size:.76em;margin-top:14px;color:var(--gold)}.subtitle{margin:30px 0 13px;font-size:19px;letter-spacing:.26em}.tagline{color:var(--muted);font-size:13px;line-height:1.8;margin:0}.menu{margin-top:52px;display:grid;gap:12px;max-width:385px}.menu button{min-height:69px;border:1px solid var(--line);background:linear-gradient(90deg,#142330dd,#14233055);text-align:left;padding:14px 24px;display:flex;align-items:center;gap:20px;transition:background .2s,border-color .2s}.menu button:hover{border-color:var(--gold);background:#263440e8}.menu .primary{background:linear-gradient(90deg,#e5c88b,#b99861);border-color:#e5c88b;color:#14202d;box-shadow:0 8px 35px #0003}.menu .primary:hover{background:#f0d9a9}.menu b{font-size:20px;font-weight:500;display:block}.menu small{font-size:10px;letter-spacing:.17em;display:block;margin-top:4px;opacity:.75}.symbol{font:24px Georgia}.menu-note{color:#a4b0c0;font-size:12px;margin:19px 0 0}.bottom{position:absolute;bottom:28px;left:8vw;right:6vw;display:flex;align-items:center;justify-content:space-between;gap:20px;color:#a3b4c6;font-size:11px;letter-spacing:.08em}.bottom strong{color:#d3c29d;font-weight:400;letter-spacing:.25em}.bottom kbd{font:inherit;border:1px solid #596270;border-radius:3px;padding:3px 6px;margin-right:5px}.modal{width:min(910px,92vw);max-height:90svh;overflow:auto;padding:0;background:#0d1928f5;color:var(--ivory);border:1px solid #b4a17a80;box-shadow:0 30px 110px #000b}.modal::backdrop{background:#030a15b8;backdrop-filter:blur(7px)}.panel-head{padding:32px 36px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--gold);margin:0 0 9px}h2{font-size:27px;font-weight:500;margin:0}.panel-head p:last-child{font-size:13px;color:var(--muted);margin-bottom:0;line-height:1.7}.close{border:1px solid #667384;background:none;padding:9px 13px;font-size:12px;white-space:nowrap}.slots{padding:24px 36px;display:grid;gap:12px}.slot{position:relative;display:grid;grid-template-columns:56px 1fr auto;gap:18px;text-align:left;align-items:center;width:100%;padding:18px 20px;background:#152537c9;border:1px solid #5c6c804f;min-height:112px}.slot:hover:not(:disabled),.slot.selected{border-color:var(--gold);background:linear-gradient(100deg,#b3955925,#192d42)}.slot.selected:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}.slot-id{font:29px Georgia;color:var(--gold);align-self:start;margin-top:7px}.slot-id small{font:9px 'Segoe UI';display:block;letter-spacing:.1em;margin-top:7px;color:#a4adbc}.slot h3{font-size:17px;margin:0 0 9px;font-weight:500}.slot p{font-size:12px;color:#b7c4d2;margin:5px 0;line-height:1.7}.badge{border:1px solid #91baba66;color:#9ddad6;font-size:10px;padding:5px 9px;white-space:nowrap}.empty .badge{color:#bfc4ce;border-color:#6a748266}.panel-foot{padding:21px 36px 29px;border-top:1px solid var(--line);display:flex;gap:16px;justify-content:space-between;align-items:center}.panel-foot p{font-size:12px;color:var(--muted);line-height:1.8;margin:0}.actions{display:flex;gap:10px}.action{padding:12px 19px;border:1px solid #758291;background:#1a2c40;white-space:nowrap;font-size:13px}.action.gold{color:#15202e;background:#dfc18a;border-color:#dfc18a}.confirm{width:min(500px,90vw);padding:32px}.confirm h2{font-size:24px;line-height:1.4}.confirm p{font-size:14px;color:#bac5d1;line-height:1.9;margin:20px 0 26px}.confirm .actions{justify-content:flex-end}.toast{position:fixed;z-index:8;bottom:70px;left:50%;transform:translateX(-50%);background:#142638f5;border:1px solid var(--gold);color:var(--ivory);padding:18px 24px;max-width:90vw;text-align:center;font-size:14px;line-height:1.7}.toast[hidden]{display:none}@media(max-width:700px){.reviewbar{flex-wrap:wrap;font-size:10px;gap:8px}.reviewbar span{max-width:230px}.stage{min-height:calc(100svh - 72px);padding:65px 7vw 110px;background-position:64% center}.stage:before{background:linear-gradient(90deg,#07101ae8,#08162596),linear-gradient(0deg,#050e1b,transparent)}h1{font-size:65px}.subtitle{font-size:16px}.menu{margin-top:40px}.bottom{left:7vw;right:7vw;flex-wrap:wrap;font-size:10px}.panel-head{padding:24px 20px}.slots{padding:18px 15px}.slot{grid-template-columns:36px 1fr;gap:12px;padding:16px 12px}.slot .badge{grid-column:2;justify-self:start}.slot-id{font-size:24px}.panel-foot{padding:20px;flex-wrap:wrap}.actions{flex-wrap:wrap}h2{font-size:23px}.confirm{padding:25px}.crest{font-size:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:700px){.panel-head{flex-direction:column-reverse;gap:14px}.panel-head .close{align-self:flex-end}.panel-head h2{word-break:keep-all}.panel-head p{word-break:keep-all}}
</style></head>
<body>
<header class="reviewbar"><strong>TITLE STUDY · 01</strong><span>화면 시안 · 저장 정보는 예시이며 실제 저장을 변경하지 않습니다.</span><button id="reset">처음 화면</button></header>
<main class="stage" id="stage"><section class="title-content"><div class="crest">BEYOND THE RIFT</div><h1>TALES<span>TACTICS</span></h1><p class="subtitle">경계를 잇는 의지</p><p class="tagline">갈라진 세계, 다시 이어지는 이야기.</p><nav class="menu" aria-label="타이틀 메뉴"><button class="primary" id="new"><span class="symbol" aria-hidden="true">◇</span><span><b>새 게임</b><small>NEW JOURNEY</small></span></button><button id="load"><span class="symbol" aria-hidden="true">▱</span><span><b>저장된 게임 불러오기</b><small>LOAD GAME</small></span></button></nav><p class="menu-note">당신의 선택으로 이어질 다음 이야기.</p></section><footer class="bottom"><div><kbd>↑ ↓</kbd> 선택　 <kbd>Enter</kbd> 확인　 <kbd>Esc</kbd> 돌아가기</div><strong>A TACTICAL FANTASY</strong></footer></main>
<dialog class="modal" id="slots-dialog" aria-labelledby="slots-heading"><div class="panel-head"><div><p class="eyebrow" id="mode-label">LOAD GAME</p><h2 id="slots-heading">저장된 게임 불러오기</h2><p id="slots-description"></p></div><button class="close" id="close-slots">닫기 · Esc</button></div><div class="slots" id="slots"></div><div class="panel-foot"><p id="selection-note" aria-live="polite"></p><div class="actions" id="slot-actions"></div></div></dialog>
<dialog class="modal confirm" id="confirm-dialog" aria-labelledby="confirm-heading"><p class="eyebrow">NEW JOURNEY</p><h2 id="confirm-heading">이 슬롯에서 새로 시작할까요?</h2><p id="confirm-copy"></p><div class="actions"><button class="action" id="cancel-confirm">취소</button><button class="action gold" id="accept-confirm">새 게임 시작</button></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const slots=[{id:1,title:'6화 · 귀환의 대가',progress:'메인 5 / 20 완료 · 크레스 Lv.12',date:'2026.10.14  21:32',suspend:true},{id:2,title:'2화 · 불꽃과 가시',progress:'메인 1 / 20 완료 · 크레스 Lv.4',date:'2026.10.13  19:08',suspend:false},{id:3,empty:true}];
const $=s=>document.querySelector(s),slotDialog=$('#slots-dialog'),confirmDialog=$('#confirm-dialog');let mode='load',selected=0,trigger=null,timer;
function openSlots(next){mode=next;selected=next==='new'?2:0;trigger=document.activeElement;$('#mode-label').textContent=next==='new'?'NEW JOURNEY':'LOAD GAME';$('#slots-heading').textContent=next==='new'?'새 게임을 시작할 슬롯':'저장된 게임 불러오기';$('#slots-description').textContent=next==='new'?'새로운 이야기를 기록할 자리를 선택하세요.':'이어서 플레이할 여정을 선택하세요.';renderSlots();slotDialog.showModal();document.querySelectorAll('.slot')[selected].focus();}
function renderSlots(){const root=$('#slots');root.replaceChildren();slots.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='slot'+(i===selected?' selected':'')+(s.empty?' empty':'');b.setAttribute('aria-pressed',String(i===selected));b.disabled=mode==='load'&&s.empty;b.dataset.index=i;b.innerHTML=`<span class="slot-id">0${s.id}<small>SLOT</small></span><div><h3>${s.empty?'비어 있는 슬롯':s.title}</h3><p>${s.empty?'아직 기록된 이야기가 없습니다.':s.progress}</p>${s.empty?'':`<p>마지막 저장　${s.date}</p>`}</div><span class="badge">${s.empty?(mode==='new'?'새 여정 시작':'저장 없음'):(s.suspend?'전투 중단 · 3턴':'거점 저장')}</span>`;b.onclick=()=>{selected=i;renderSlots();document.querySelectorAll('.slot')[i].focus()};root.append(b)});const s=slots[selected],actions=$('#slot-actions');actions.replaceChildren();$('#selection-note').textContent=mode==='new'?(s.empty?'빈 슬롯에 새로운 이야기를 시작합니다.':'기존 기록이 있습니다. 시작 전에 덮어쓰기를 확인합니다.'):(s.suspend?'중단한 전투에서 이어하거나 거점으로 돌아갑니다.':'저장한 거점에서 이야기를 이어갑니다.');function action(text,fn,gold){const b=document.createElement('button');b.className='action'+(gold?' gold':'');b.textContent=text;b.onclick=fn;actions.append(b)}if(mode==='new')action('이 슬롯에서 시작',confirmNew,true);else{if(s.suspend)action('거점으로 불러오기',()=>finish('슬롯 '+s.id+'의 거점으로 이동하는 흐름입니다.'));action(s.suspend?'중단 전투 이어하기':'불러오기',()=>finish('슬롯 '+s.id+(s.suspend?'의 중단 전투를 이어하는':'의 거점으로 이동하는')+' 흐름입니다.'),true)}}
function confirmNew(){const s=slots[selected];$('#confirm-heading').textContent=s.empty?'새로운 이야기를 시작할까요?':'슬롯 '+s.id+'의 기록을 덮어쓸까요?';$('#confirm-copy').textContent=s.empty?'슬롯 '+s.id+'에 새 여정을 기록합니다. 크레스와 민트의 첫 이야기에서 시작합니다.':s.title+'의 성장·장비·진행 기록과 중단 전투가 새 게임으로 교체됩니다. 다른 슬롯은 유지됩니다.';confirmDialog.showModal();$('#cancel-confirm').focus()}
function finish(message){if(confirmDialog.open)confirmDialog.close();if(slotDialog.open)slotDialog.close();$('#toast').textContent='시안 미리보기 · '+message+' 실제 게임은 시작하지 않습니다.';$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,6000);trigger?.focus()}
$('#new').onclick=()=>openSlots('new');$('#load').onclick=()=>openSlots('load');$('#close-slots').onclick=()=>slotDialog.close();$('#cancel-confirm').onclick=()=>confirmDialog.close();$('#accept-confirm').onclick=()=>finish('슬롯 '+slots[selected].id+'에서 메인 1화를 시작하는 흐름입니다.');$('#reset').onclick=()=>{if(confirmDialog.open)confirmDialog.close();if(slotDialog.open)slotDialog.close();$('#toast').hidden=true;$('#new').focus()};
document.addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp'].includes(e.key))return;const root=confirmDialog.open?confirmDialog:slotDialog.open?slotDialog:$('.menu');const buttons=[...root.querySelectorAll('button:not(:disabled)')];let i=buttons.indexOf(document.activeElement);i=(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[i]?.focus();e.preventDefault()});
</script></body></html>

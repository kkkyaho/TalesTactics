<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전용무기 적용 · 실제 게임 화면</title>
<style>body{margin:0;background:#101724;color:#e5edf7;font:16px/1.65 system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:36px 24px}h1{font-size:30px;margin:0}p{color:#a7b7c8}nav{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}button{font:inherit;background:#1c2b40;color:inherit;border:1px solid #344b65;border-radius:8px;padding:9px 16px;cursor:pointer}button[aria-pressed=true]{background:#c9b789;color:#101724}figure{margin:0}img{display:block;width:100%;border:1px solid #344b65;border-radius:10px}figcaption{margin:10px 0 24px;color:#a7b7c8}.actions{display:flex;gap:10px;align-items:center;margin-bottom:15px}a{color:#78d4d1}</style>
<main><h1>전용무기 적용 · 실제 게임 화면</h1><p>Unity Windows 실행본에서 촬영한 장비 화면입니다. 무기 선택 시 캐릭터 외형과 고유 아이콘을 함께 확인할 수 있습니다.</p><nav id="heroes"></nav><div class="actions"><button id="before" aria-pressed="false">기본 외형</button><button id="after" aria-pressed="true">전용무기 선택</button><a href="README.md">적용 범위와 검증</a></div><figure><img id="screen" alt=""><figcaption id="caption"></figcaption></figure><h2>편성 화면</h2><img src="formation-equipped.png" alt="전용무기를 장착한 열 캐릭터의 편성 화면"></main>
<script>const heroes=[['cless','크레스','이터널 소드'],['mint','민트','BC 로드'],['farah','파라','갓 웨폰'],['tear','티아','유니콘 혼'],['jade','제이드','블러드 페인'],['natalia','나탈리아','홀리 퀼카틀'],['velvet','벨벳','무명의 칼날'],['alphen','알펜','네빌림'],['shionne','시온','데모니시 코어'],['kisara','키사라','오스 렉스']];let selected=0,equipped=true;const byId=id=>document.getElementById(id);function show(){const h=heroes[selected];byId('screen').src=h[0]+(equipped?'-equipped-1280.png':'-default.png');byId('screen').alt=h[1]+' · '+h[2];byId('caption').textContent=h[1]+' · '+h[2]+' · '+(equipped?'전용무기 선택 미리보기':'기본 외형')+' / 1280 × 720 · 글자 130%';[...byId('heroes').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===selected));byId('before').setAttribute('aria-pressed',!equipped);byId('after').setAttribute('aria-pressed',equipped)}heroes.forEach((h,i)=>{const b=document.createElement('button');b.textContent=h[1];b.onclick=()=>{selected=i;show()};byId('heroes').append(b)});byId('before').onclick=()=>{equipped=false;show()};byId('after').onclick=()=>{equipped=true;show()};show();</script></html>
